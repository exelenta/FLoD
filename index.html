<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>활동 신청 정보 편집기</title>
  <meta name="description" content="모바일 활동 신청 화면에서 필요한 항목만 직접 편집합니다.">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FLoD">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#343d4e;-webkit-text-size-adjust:100%}
    body{display:grid;place-items:start center;overflow-x:hidden}
    .phone{position:relative;width:min(100vw,430px);aspect-ratio:941/1903;background:#fff;overflow:hidden;isolation:isolate;box-shadow:0 0 40px rgba(23,30,42,.12)}
    .screen{position:absolute;inset:0;background:#fff}
    button{font:inherit;color:inherit}.apphead{height:6%;display:flex;align-items:center;justify-content:space-between;padding:0 3.2%;background:#f7f8fa;border-bottom:1px solid #e9ebef;font-size:clamp(16px,4vw,19px);font-weight:650;color:#596274}.hamb{border:0;background:transparent;font-size:1.8em;font-weight:300;line-height:1;letter-spacing:-.22em;padding:8px .18em 8px 8px;cursor:pointer;-webkit-tap-highlight-color:transparent}.hamb:active{opacity:.55}
    .tabs{height:4.5%;display:flex;align-items:center;padding:0 4.1%;gap:2.25%;border-bottom:1px solid #d9dce1;font-size:clamp(14px,3.35vw,16px);white-space:nowrap}.tabs .blue{color:#3f63a7;font-weight:650}.tabs .muted{color:#636d7f}
    .datebar{height:8.45%;display:flex;align-items:center;justify-content:center;gap:1.25%;background:#f8f9fb;border-bottom:1px solid #edf0f3}.datebox,.daybtn{height:42%;border:1px solid #d9dde4;border-radius:7px;display:grid;place-items:center;color:#5c6678;background:#fff;font-size:clamp(15px,4vw,19px);cursor:pointer;-webkit-tap-highlight-color:transparent}.datebox{position:relative;width:35.7%;white-space:nowrap}.datebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.daybtn{width:10.3%;padding:0}.daybtn:active,.datebox:active{background:#edf0f4}.arrow{width:8.5%;font-size:1.7em}.backcontent{height:81.05%;background:#f4f5f7;padding:3% 3%;font-size:clamp(13px,3.2vw,16px);color:#566170}.backcontent .activity{margin:-3.7% -3% 0;padding:6% 3% 4.6%;background:#dcefea}.backcontent p{margin:.6em 0}.back-row{display:grid;grid-template-columns:28% 72%;padding:3.2% 0;border-bottom:1px solid #e0e3e8}.back-label{font-weight:600}
    .shade{position:absolute;inset:0 0 4.2%;background:rgba(58,68,86,.53);z-index:3;pointer-events:none}
    .modal{position:absolute;z-index:4;left:4%;right:4%;top:18.75%;height:75.15%;background:#fff;border-radius:10px;padding:2.55% 4.05% 2%;box-shadow:0 2px 4px rgba(0,0,0,.08);display:flex;flex-direction:column}
    .title{height:8%;display:flex;align-items:center;color:#111827;font-size:clamp(19px,4.3vw,22px);font-weight:700;letter-spacing:-.04em;white-space:nowrap}.title .num{font-size:.75em;font-weight:600;color:#344053;margin-left:.25em}
    .rows{flex:1}.row{display:grid;grid-template-columns:24.5% 75.5%;min-height:8.7%;border-bottom:1px solid #e5e7eb;align-items:center;font-size:clamp(16px,3.95vw,20px);letter-spacing:-.045em}.row.tall{min-height:11.2%}.row.status{min-height:12.6%;align-items:start;padding-top:3.1%}.label{font-weight:600;color:#343d4d}.sub{font-size:.72em;margin-top:.1em}.value{line-height:1.38}.secondary{display:block;color:#697385;font-size:.8em;margin-top:.15em}
    .actions{height:8.3%;display:flex;align-items:flex-end;padding-bottom:1.3%;font-size:clamp(15px,3.6vw,18px);font-weight:600}.copy{color:#1769e8;margin-right:4.5%}.cancel{color:#e31b23}.close{margin-left:auto;color:#252e3d;border:1px solid #cfd4db;border-radius:7px;padding:.72em 1.25em;background:white;box-shadow:0 1px 2px rgba(0,0,0,.09)}
    [contenteditable="true"]{cursor:text;outline:none;border-radius:2px;-webkit-user-select:text;user-select:text;min-width:1.2em}.edit-mode [contenteditable="true"]:hover{background:rgba(32,111,230,.09);box-shadow:0 0 0 2px rgba(32,111,230,.09)}[contenteditable="true"]:focus{position:relative;z-index:5;background:#fff7bf!important;box-shadow:0 0 0 2px #f4c542!important}.editable-empty{display:block;min-height:1.4em;width:100%}
    .hint{position:fixed;z-index:10;left:50%;bottom:12px;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:rgba(17,24,39,.86);color:#fff;font:500 12px/1.2 -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.hint.show{opacity:1}
    @media (min-width:431px){body{padding:24px 0}.phone{border-radius:16px}}
  </style>
</head>
<body>
  <main class="phone edit-mode" aria-label="편집 가능한 활동 신청 화면">
    <div class="screen">
      <header class="apphead"><span>활동 신청 목록</span><button class="hamb" id="refreshButton" type="button" aria-label="새로고침">☰</button></header>
      <nav class="tabs"><span>상태:</span><span class="blue">신청</span><span class="blue">승인</span><span class="muted">반려</span><span class="muted">취소</span></nav>
      <div class="datebar">
        <button class="daybtn arrow" id="prevDate" type="button" aria-label="이전 날짜">‹</button>
        <label class="datebox" for="datePicker"><span id="dateDisplay">2026-09-20 (일)</span><input id="datePicker" type="date" value="2026-09-20" aria-label="날짜 선택"></label>
        <button class="daybtn arrow" id="nextDate" type="button" aria-label="다음 날짜">›</button>
        <button class="daybtn" id="todayButton" type="button">오늘</button>
      </div>
      <div class="backcontent">
        <div class="activity"><p><span id="backgroundDate">2026-09-20</span> 활동 신청</p><p>신청 내역</p></div>
        <div class="back-row"><span class="back-label">교시</span><span>1차자습</span></div>
        <div class="back-row"><span class="back-label">구분</span><span>외출</span></div>
        <div class="back-row"><span class="back-label">학생</span><span>2413 장현준</span></div>
      </div>
    </div>
    <div class="shade"></div>
    <section class="modal">
      <div class="title"><span>신청 정보</span><span class="num">(신청번호: <span id="requestNumber">39806</span>)</span></div>
      <div class="rows">
        <div class="row"><div class="label">날짜</div><div class="value" id="modalDate">2026-09-20 (일)</div></div>
        <div class="row"><div class="label">교시</div><div class="value" contenteditable="true">1차자습</div></div>
        <div class="row"><div class="label">구분</div><div class="value" contenteditable="true">외출</div></div>
        <div class="row"><div class="label">장소</div><div class="value editable-empty" contenteditable="true"></div></div>
        <div class="row tall"><div class="label"><span>학생 명단</span><div class="sub" contenteditable="true">(1명)</div></div><div class="value" contenteditable="true" data-sync="student">2413 장현준</div></div>
        <div class="row"><div class="label">메모</div><div class="value editable-empty" contenteditable="true"></div></div>
        <div class="row tall"><div class="label">등록</div><div class="value"><span contenteditable="true" data-sync="student">2413 장현준</span><span class="secondary" id="registeredAt">2026-09-19 15:27:44</span></div></div>
        <div class="row"><div class="label">승인 담당</div><div class="value"><span contenteditable="true" data-sync="approver">추철우</span> 선생님</div></div>
        <div class="row status"><div class="label">상태</div><div class="value"><span><span contenteditable="true" data-sync="approver">추철우</span> 선생님: 승인</span><span class="secondary" id="approvedAt">2026-09-19 15:27:57</span></div></div>
      </div>
      <footer class="actions"><span class="copy">복사</span><span class="cancel">취소</span><span class="close">닫기</span></footer>
    </section>
  </main>
  <div class="hint" id="hint">표시된 내용만 눌러 수정할 수 있습니다</div>
  <script>
    const hint=document.getElementById('hint');
    const datePicker=document.getElementById('datePicker');
    const dateDisplay=document.getElementById('dateDisplay');
    const modalDate=document.getElementById('modalDate');
    const backgroundDate=document.getElementById('backgroundDate');
    const registeredAt=document.getElementById('registeredAt');
    const approvedAt=document.getElementById('approvedAt');
    const weekdays=['일','월','화','수','목','금','토'];
    const pad=value=>String(value).padStart(2,'0');
    const inputDate=date=>`${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
    const parseDate=value=>{const [year,month,day]=value.split('-').map(Number);return new Date(year,month-1,day)};
    const displayDate=date=>`${inputDate(date)} (${weekdays[date.getDay()]})`;
    const timestamp=(date,seconds)=>`${inputDate(date)} ${pad(Math.floor(seconds/3600))}:${pad(Math.floor(seconds%3600/60))}:${pad(seconds%60)}`;

    function randomizeTimes(date){
      const previousDay=new Date(date); previousDay.setDate(previousDay.getDate()-1);
      const workStart=9*3600;
      const approvalLimit=17*3600+30*60;
      const registeredSeconds=workStart+Math.floor(Math.random()*(7*3600+45*60));
      const gap=60+Math.floor(Math.random()*2700);
      const approvedSeconds=Math.min(registeredSeconds+gap,approvalLimit);
      registeredAt.textContent=timestamp(previousDay,registeredSeconds);
      approvedAt.textContent=timestamp(previousDay,approvedSeconds);
    }

    function setDate(date){
      date.setHours(0,0,0,0);
      datePicker.value=inputDate(date);
      dateDisplay.textContent=displayDate(date);
      modalDate.textContent=displayDate(date);
      backgroundDate.textContent=inputDate(date);
      randomizeTimes(date);
    }

    document.getElementById('requestNumber').textContent=String(10000+Math.floor(Math.random()*90000));
    setDate(parseDate(datePicker.value));
    document.getElementById('prevDate').addEventListener('click',()=>{const date=parseDate(datePicker.value);date.setDate(date.getDate()-1);setDate(date)});
    document.getElementById('nextDate').addEventListener('click',()=>{const date=parseDate(datePicker.value);date.setDate(date.getDate()+1);setDate(date)});
    document.getElementById('todayButton').addEventListener('click',()=>setDate(new Date()));
    datePicker.addEventListener('change',()=>{if(datePicker.value)setDate(parseDate(datePicker.value))});
    document.getElementById('refreshButton').addEventListener('click',()=>window.location.reload());

    hint.classList.add('show'); setTimeout(()=>hint.classList.remove('show'),2200);
    document.querySelectorAll('[contenteditable]').forEach(el=>{
      el.setAttribute('spellcheck','false');
      el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el.blur()}});
      el.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
      el.addEventListener('input',()=>{
        const group=el.dataset.sync;
        if(group)document.querySelectorAll(`[data-sync="${group}"]`).forEach(other=>{if(other!==el)other.textContent=el.textContent});
      });
    });
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'))}
  </script>
</body>
</html>

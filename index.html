<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>활동 신청 정보 편집기</title>
  <meta name="description" content="모바일 활동 신청 화면의 모든 텍스트를 직접 편집합니다.">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FLoD">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#343d4e;-webkit-text-size-adjust:100%}
    body{display:grid;place-items:start center;overflow-x:hidden}
    .phone{position:relative;width:min(100vw,430px);aspect-ratio:941/1903;background:#fff;overflow:hidden;isolation:isolate;box-shadow:0 0 40px rgba(23,30,42,.12)}
    .screen{position:absolute;inset:0;background:#fff}
    .apphead{height:6%;display:flex;align-items:center;justify-content:space-between;padding:0 3.2%;background:#f7f8fa;border-bottom:1px solid #e9ebef;font-size:clamp(16px,4vw,19px);font-weight:650;color:#596274}.hamb{font-size:1.8em;font-weight:300;line-height:1;letter-spacing:-.22em;padding-right:.18em}
    .tabs{height:4.5%;display:flex;align-items:center;padding:0 4.1%;gap:2.25%;border-bottom:1px solid #d9dce1;font-size:clamp(14px,3.35vw,16px);white-space:nowrap}.tabs .blue{color:#3f63a7;font-weight:650}.tabs .muted{color:#636d7f}
    .datebar{height:8.45%;display:flex;align-items:center;justify-content:center;gap:1.25%;background:#f8f9fb;border-bottom:1px solid #edf0f3}.datebox,.daybtn{height:42%;border:1px solid #d9dde4;border-radius:7px;display:grid;place-items:center;color:#5c6678;font-size:clamp(15px,4vw,19px)}.datebox{width:35.7%}.daybtn{width:10.3%}.arrow{width:8.5%;font-size:1.7em}.backcontent{height:81.05%;background:#f4f5f7;padding:3% 3%;font-size:clamp(13px,3.2vw,16px);color:#566170}.backcontent .activity{margin:-3.7% -3% 0;padding:6% 3% 4.6%;background:#dcefea}.backcontent p{margin:.6em 0}.back-row{display:grid;grid-template-columns:28% 72%;padding:3.2% 0;border-bottom:1px solid #e0e3e8}.back-label{font-weight:600}
    .shade{position:absolute;inset:0 0 4.2%;background:rgba(58,68,86,.53);z-index:3;pointer-events:none}
    .modal{position:absolute;z-index:4;left:4%;right:4%;top:18.75%;height:75.15%;background:#fff;border-radius:10px;padding:2.55% 4.05% 2%;box-shadow:0 2px 4px rgba(0,0,0,.08);display:flex;flex-direction:column}
    .title{height:8%;display:flex;align-items:center;color:#111827;font-size:clamp(19px,4.3vw,22px);font-weight:700;letter-spacing:-.04em;white-space:nowrap}.title .num{font-size:.75em;font-weight:600;color:#344053;margin-left:.25em}
    .rows{flex:1}.row{display:grid;grid-template-columns:24.5% 75.5%;min-height:8.7%;border-bottom:1px solid #e5e7eb;align-items:center;font-size:clamp(16px,3.95vw,20px);letter-spacing:-.045em}.row.tall{min-height:11.2%}.row.status{min-height:12.6%;align-items:start;padding-top:3.1%}.label{font-weight:600;color:#343d4d}.sub{font-size:.72em;margin-top:.1em}.value{line-height:1.38}.secondary{display:block;color:#697385;font-size:.8em;margin-top:.15em}
    .actions{height:8.3%;display:flex;align-items:flex-end;padding-bottom:1.3%;font-size:clamp(15px,3.6vw,18px);font-weight:600}.copy{color:#1769e8;margin-right:4.5%}.cancel{color:#e31b23}.close{margin-left:auto;color:#252e3d;border:1px solid #cfd4db;border-radius:7px;padding:.72em 1.25em;background:white;box-shadow:0 1px 2px rgba(0,0,0,.09)}
    [contenteditable="true"]{cursor:text;outline:none;border-radius:2px;-webkit-user-select:text;user-select:text}.edit-mode [contenteditable="true"]:hover{background:rgba(32,111,230,.09);box-shadow:0 0 0 2px rgba(32,111,230,.09)}[contenteditable="true"]:focus{position:relative;z-index:5;background:#fff7bf!important;box-shadow:0 0 0 2px #f4c542!important}
    .hint{position:fixed;z-index:10;left:50%;bottom:12px;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:rgba(17,24,39,.86);color:#fff;font:500 12px/1.2 -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}.hint.show{opacity:1}
    @media (min-width:431px){body{padding:24px 0}.phone{border-radius:16px}}
  </style>
</head>
<body>
  <main class="phone edit-mode" aria-label="편집 가능한 활동 신청 화면">
    <div class="screen">
      <header class="apphead"><span contenteditable="true">활동 신청 목록</span><span class="hamb" aria-hidden="true">☰</span></header>
      <nav class="tabs"><span contenteditable="true">상태:</span><span class="blue" contenteditable="true">신청</span><span class="blue" contenteditable="true">승인</span><span class="muted" contenteditable="true">반려</span><span class="muted" contenteditable="true">취소</span></nav>
      <div class="datebar"><span class="daybtn arrow" contenteditable="true">‹</span><span class="datebox" contenteditable="true">2026-09-20 (일)</span><span class="daybtn arrow" contenteditable="true">›</span><span class="daybtn" contenteditable="true">오늘</span></div>
      <div class="backcontent">
        <div class="activity"><p contenteditable="true">2026-09-20 활동 신청</p><p contenteditable="true">신청 내역</p></div>
        <div class="back-row"><span class="back-label" contenteditable="true">교시</span><span contenteditable="true">1차자습</span></div>
        <div class="back-row"><span class="back-label" contenteditable="true">구분</span><span contenteditable="true">외출</span></div>
        <div class="back-row"><span class="back-label" contenteditable="true">학생</span><span contenteditable="true">2413 장현준</span></div>
      </div>
    </div>
    <div class="shade"></div>
    <section class="modal">
      <div class="title"><span contenteditable="true">신청 정보</span><span class="num" contenteditable="true">(신청번호: 39806)</span></div>
      <div class="rows">
        <div class="row"><div class="label" contenteditable="true">날짜</div><div class="value" contenteditable="true">2026-09-20 (일)</div></div>
        <div class="row"><div class="label" contenteditable="true">교시</div><div class="value" contenteditable="true">1차자습</div></div>
        <div class="row"><div class="label" contenteditable="true">구분</div><div class="value" contenteditable="true">외출</div></div>
        <div class="row"><div class="label" contenteditable="true">장소</div><div class="value" contenteditable="true"><br></div></div>
        <div class="row tall"><div class="label"><span contenteditable="true">학생 명단</span><div class="sub" contenteditable="true">(1명)</div></div><div class="value" contenteditable="true">2413 장현준</div></div>
        <div class="row"><div class="label" contenteditable="true">메모</div><div class="value" contenteditable="true"><br></div></div>
        <div class="row tall"><div class="label" contenteditable="true">등록</div><div class="value"><span contenteditable="true">2413 장현준</span><span class="secondary" contenteditable="true">2026-09-15 15:27:44</span></div></div>
        <div class="row"><div class="label" contenteditable="true">승인 담당</div><div class="value" contenteditable="true">추철우 선생님</div></div>
        <div class="row status"><div class="label" contenteditable="true">상태</div><div class="value"><span contenteditable="true">추철우 선생님: 승인</span><span class="secondary" contenteditable="true">2026-09-15 15:27:57</span></div></div>
      </div>
      <footer class="actions"><span class="copy" contenteditable="true">복사</span><span class="cancel" contenteditable="true">취소</span><span class="close" contenteditable="true">닫기</span></footer>
    </section>
  </main>
  <div class="hint" id="hint">글자를 클릭하면 바로 수정할 수 있습니다</div>
  <script>
    const hint=document.getElementById('hint');
    hint.classList.add('show'); setTimeout(()=>hint.classList.remove('show'),2200);
    document.querySelectorAll('[contenteditable]').forEach(el=>{
      el.setAttribute('spellcheck','false');
      el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el.blur()}});
      el.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
    });
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'))}
  </script>
</body>
</html>
